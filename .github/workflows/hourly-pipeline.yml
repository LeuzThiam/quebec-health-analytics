name: hourly emergency pipeline

on:
  workflow_dispatch:
  schedule:
    # Décalage volontaire pour éviter la congestion fréquente au début de l'heure.
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: hourly-emergency-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: HEALTH_ELT_WH
      SNOWFLAKE_DATABASE: QUEBEC_HEALTH_DWH

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ingest latest emergency snapshot
        env:
          SNOWFLAKE_AUTHENTICATOR: snowflake
          SNOWFLAKE_ROLE: QUEBEC_HEALTH_INGESTION
        run: python ingestion/emergency_hourly.py

      - name: Build and test analytical models
        env:
          SNOWFLAKE_ROLE: QUEBEC_HEALTH_TRANSFORM
        run: >-
          dbt build
          --project-dir dbt/quebec_health
          --profiles-dir dbt/quebec_health
