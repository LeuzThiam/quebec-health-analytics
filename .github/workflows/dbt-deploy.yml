name: dbt production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SNOWFLAKE_PROD_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PROD_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PROD_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PROD_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_PROD_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PROD_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dbt
        run: python -m pip install "dbt-snowflake==1.12.1"

      - name: Validate production connection
        run: >-
          dbt debug
          --target prod
          --project-dir dbt/quebec_health
          --profiles-dir dbt/quebec_health

      - name: Build production models
        run: >-
          dbt build
          --target prod
          --project-dir dbt/quebec_health
          --profiles-dir dbt/quebec_health
