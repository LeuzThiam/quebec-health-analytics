version: 2

sources:
  - name: raw
    database: "{{ target.database }}"
    schema: raw
    tables:
      - name: urgences_horaires
        identifier: URGENCES_HORAIRES_RAW
      - name: installations
        identifier: INSTALLATIONS_RAW
      - name: urgences_cumulatives
        identifier: URGENCES_CUMULATIVES_RAW
      - name: surgery_waitlist
        identifier: SURGERY_WAITLIST_RAW
      - name: population_health_region
        identifier: POPULATION_HEALTH_REGION_RAW
      - name: population_comparable
        identifier: POPULATION_COMPARABLE_RAW
        description: >-
          Estimations et projections de population comparables par territoire
          sociosanitaire, produites par l'ISQ et diffusées par le MSSS sur
          Données Québec. Licence Attribution 4.0 International (CC-BY 4.0).
          Source : https://donneesquebec.ca/recherche/dataset/estimations-et-projections-de-population-comparables

models:
  - name: stg_urgences_horaires
    columns:
      - name: no_permis_installation
        data_tests:
          - not_null:
              config:
                where: "niveau_agregation = 'INSTALLATION'"
      - name: niveau_agregation
        data_tests:
          - accepted_values:
              arguments:
                values: [PROVINCIAL, REGIONAL, INSTALLATION]

  - name: stg_installations
    columns:
      - name: installation_code
        data_tests:
          - not_null
          - unique

  - name: stg_urgences_cumulatives
    columns:
      - name: annee_financiere
        data_tests: [not_null]
      - name: cumul_periode
        data_tests: [not_null]
      - name: niveau_agregation
        data_tests:
          - accepted_values:
              arguments:
                values: [PROVINCIAL, REGIONAL, ETABLISSEMENT, INSTALLATION]

  - name: stg_surgery_waitlist
    columns:
      - name: financial_period
        data_tests: [not_null]
      - name: wait_bucket
        data_tests: [not_null]
      - name: region_code
        data_tests: [not_null]

  - name: stg_population_health_region
    columns:
      - name: reference_year
        data_tests: [not_null]
      - name: region_code
        data_tests: [not_null]
      - name: age_group
        data_tests: [not_null]
      - name: sex_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [TOTAL, MALE, FEMALE]
      - name: population
        data_tests: [not_null]

  - name: stg_population_comparable
    description: Population ISQ/MSSS typée au grain RSS, année, sexe et âge.
    columns:
      - name: population_comparable_key
        data_tests: [not_null, unique]
      - name: region_code
        data_tests: [not_null]
      - name: reference_year
        data_tests: [not_null]
      - name: sex_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [TOTAL, MALE, FEMALE]
      - name: data_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ESTIMATE, PROJECTION]
      - name: population
        data_tests: [not_null]
