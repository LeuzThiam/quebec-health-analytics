version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [not_null, unique]

  - name: dim_time
    columns:
      - name: time_key
        data_tests: [not_null, unique]

  - name: dim_region
    columns:
      - name: region_key
        data_tests: [not_null, unique]

  - name: dim_installations_urgence
    columns:
      - name: facility_key
        data_tests: [not_null, unique]
      - name: region_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key

  - name: fct_urgences_horaires
    columns:
      - name: emergency_snapshot_key
        data_tests: [not_null, unique]
      - name: facility_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_installations_urgence')
                field: facility_key
      - name: region_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key

  - name: agg_emergency_daily
    description: Indicateurs quotidiens par installation pour le suivi de la pression aux urgences.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: facility_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_installations_urgence')
                field: facility_key
      - name: region_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key
      - name: snapshot_count
        data_tests: [not_null]
      - name: observed_hours
        data_tests: [not_null]

  - name: fct_urgences_cumulatives
    description: Historique cumulatif des urgences par année financière, période et niveau organisationnel.
    columns:
      - name: emergency_cumulative_key
        data_tests: [not_null, unique]
      - name: annee_financiere
        data_tests: [not_null]
      - name: cumul_periode
        data_tests: [not_null]
      - name: niveau_agregation
        data_tests:
          - accepted_values:
              arguments:
                values: [PROVINCIAL, REGIONAL, ETABLISSEMENT, INSTALLATION]

  - name: dim_specialty
    columns:
      - name: specialty_key
        data_tests: [not_null, unique]
      - name: specialty_code
        data_tests: [not_null, unique]

  - name: dim_wait_bucket
    columns:
      - name: wait_bucket_key
        data_tests: [not_null, unique]
      - name: wait_bucket
        data_tests: [not_null, unique]

  - name: fct_surgery_waitlist
    columns:
      - name: surgery_waitlist_key
        data_tests: [not_null, unique]
      - name: region_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key
      - name: specialty_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_specialty')
                field: specialty_key
      - name: wait_bucket_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wait_bucket')
                field: wait_bucket_key

